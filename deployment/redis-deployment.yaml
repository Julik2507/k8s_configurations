apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment

spec:
  selector:
    matchLabels:
      tier: redis
  template:
    metadata:
      name: redis
      labels:
        tier: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
              name: redis
  replicas: 1
    