apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment

spec:
  selector:
    matchLabels:
      tier: db
  template:
    metadata:
      name: db
      labels:
        tier: db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
  replicas: 1
    