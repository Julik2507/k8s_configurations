apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-app-deployment

spec:
  selector:
    matchLabels:
      tier: vote
  template:
    metadata:
      name: vote
      labels:
        tier: vote
    spec:
      containers:
        - name: vote
          image: dockersamples/examplevotingapp_vote
          ports:
            - containerPort: 80
              name: vote
  replicas: 1