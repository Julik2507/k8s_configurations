apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment

spec:
  selector:
    matchLabels:
      tier: front-end

  template:
    metadata:
      name: myapp-pod
      labels:
        tier: front-end
    spec:
      containers:
        - name: nginx-container
          image: nginx
  replicas: 3
     